name: SauceDemo build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '00 10 * * *'

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      USER: ${{secrets.USER}}
      PASSWORD: ${{secrets.PASSWORD}}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install Edge
      uses: abhi1693/setup-browser@v0.3.4
      with:
        browser: edge
        version: latest

    - name: Tests Run
      run: mvn clean -Duser=$USER -Dpassword=$PASSWORD test
